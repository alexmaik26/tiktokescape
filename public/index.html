<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <title>TikTok Escape Race</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- ══ GAME CANVAS (full 1080×1920, z=0) ══════════════════ -->
  <canvas id="gameCanvas" width="1080" height="1920"></canvas>

  <!-- ══ HEADER (0–90px) ════════════════════════════════════ -->
  <header id="header">
    <div id="headerTitle">🏟 TikTok Escape Race</div>
    <div id="headerStatus">Race in progress</div>
  </header>

  <!-- ══ LEADERBOARD STRIP (90–125px) ══════════════════════ -->
  <div id="leaderboardStrip">
    <!-- entries populated by leaderboard.js -->
  </div>

  <!-- ══ GIFT BOOSTS PANEL (125–235px) ════════════════════ -->
  <div id="giftMapPanel">
    <div id="gmpHeader">
      <span id="gmpTitle">🎁 Gift Boosts</span>
      <span id="gmpPager"></span>
    </div>
    <div id="gmpContent">
      <!-- populated by JS -->
    </div>
  </div>

  <!-- ══ BOOST POP-UPS (mid-screen) ═════════════════════════ -->
  <div id="boostNotifs"></div>

  <!-- ══ WINNER OVERLAY ══════════════════════════════════════ -->
  <div id="winnerOverlay" class="hidden">
    <canvas id="confettiCanvas" width="1080" height="1920"></canvas>
    <div id="winnerContent">
      <div id="winnerBadge">🏆 WINNER!</div>
      <div id="winnerLogoWrap">
        <img id="winnerLogo" src="" alt="" onerror="this.style.display='none'">
      </div>
      <div id="winnerTeamName"></div>
      <div id="winnerPlayerName"></div>
      <div id="winnerNextRace">Next race starting…</div>
    </div>
  </div>

  <!-- ══ COUNTDOWN OVERLAY ═══════════════════════════════════ -->
  <div id="countdownOverlay" class="hidden">
    <div id="cdLabel">Get Ready!</div>
    <div id="cdNumber">5</div>
    <div id="cdSub">Send gifts to boost your team</div>
  </div>

  <!-- ══ DEV PANEL (visible when URL has ?dev=1) ════════════ -->
  <div id="devPanel" class="hidden">
    <div id="devHeader">🔧 DEV MODE</div>
    <div id="devSubtitle">Simulate gift events</div>
    <div id="devTeams"></div>
    <div id="devLegend">
      <span class="db mini">⚡</span> Mini
      <span class="db medium">🔥</span> Medium
      <span class="db mega">💥</span> Mega
    </div>
  </div>

  <!-- ══ SCRIPTS ══════════════════════════════════════════════ -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/sounds.js"></script>
  <script src="/js/animator.js"></script>
  <script src="/js/renderer.js"></script>
  <script src="/js/feed.js"></script>
  <script src="/js/leaderboard.js"></script>
  <script src="/js/game.js"></script>

</body>
</html>
